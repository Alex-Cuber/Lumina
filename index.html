<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumina Web</title>
    <link rel="icon" type="image/x-icon" href="icon.ico">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container" id="mainContainer">
        <div class="search-container">
            <input type="text" id="searchInput" class="search-input" placeholder="Buscar juego...">
        </div>

        <div id="gamesList" class="games-list"></div>
    </div>

    <div id="gameModal" class="modal">
        <div class="modal-content">
            <button class="btn-back" onclick="closeModal()">VOLVER</button>
            
            <div class="modal-header">
                <img id="modalImg" class="modal-image" src="" alt="Juego">
                <div>
                    <div id="modalTitle" class="modal-title"></div>
                    <div id="modalFont" class="modal-font"></div>
                </div>
            </div>

            <div class="modal-body">
                <div id="modalDesc" class="modal-desc"></div>
                <a id="modalDownloadBtn" class="btn-download-large" href="" download>Descargar</a>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>

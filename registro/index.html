<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrarse - Lumina Web</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background-color: #101020;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        /* Contenedor principal de la tarjeta/formulario */
        .card-container {
            width: 100%;
            max-width: 450px;
            background-color: #101020;
            border: 2px solid #101040;
            border-radius: 4px;
            padding: 25px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        }

        .title {
            font-size: 32px;
            font-weight: bold;
            color: #ffffff;
            text-align: center;
            border-bottom: 2px solid #101040;
            padding-bottom: 12px;
        }

        .subtitle {
            font-size: 16px;
            color: #808080;
            text-align: center;
            margin-top: -5px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 13px;
            font-weight: bold;
            color: #c0c0c0;
        }

        /* Input con los estilos de la barra de búsqueda original */
        .custom-input {
            width: 100%;
            background-color: #201030;
            color: #ffffff;
            border: 1px solid #101040;
            padding: 12px 14px;
            font-size: 14px;
            border-radius: 2px;
            outline: none;
            transition: background-color 0.2s, border-color 0.2s;
        }

        .custom-input:hover, .custom-input:focus {
            background-color: #201040;
            border-color: #402060;
        }

        /* Botón con el verde característico del botón de descarga */
        .btn-submit {
            background-color: #608010;
            color: white;
            font-size: 16px;
            font-weight: bold;
            padding: 12px 18px;
            border: none;
            border-radius: 2px;
            cursor: pointer;
            text-align: center;
            width: 100%;
            transition: background-color 0.2s, opacity 0.2s;
            margin-top: 10px;
        }

        .btn-submit:hover:not(:disabled) {
            background-color: #60a010;
        }

        /* Estado desactivado del botón */
        .btn-submit:disabled {
            background-color: #2a3806;
            color: #707070;
            cursor: not-allowed;
            opacity: 0.6;
        }

        /* Pantalla de Exito */
        .success-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 15px;
            padding: 10px 0;
        }

        .btn-back {
            background-color: #402060;
            color: #ffffff;
            border: none;
            padding: 10px 20px;
            font-weight: bold;
            border-radius: 2px;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 10px;
            text-decoration: none;
        }

        .btn-back:hover {
            background-color: #403080;
        }
    </style>
</head>
<body>

    <div class="card-container">
        
        <!-- PANTALLA DE REGISTRO (FORMULARIO) -->
        <div id="registerScreen" style="display: flex; flex-direction: column; gap: 18px;">
            <h1 class="title">Registrarse</h1>

            <div class="form-group">
                <label for="username">Nombre de usuario</label>
                <input type="text" id="username" class="custom-input" placeholder="Tu usuario" oninput="validateForm()">
            </div>

            <div class="form-group">
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" class="custom-input" placeholder="correo@ejemplo.com" oninput="validateForm()">
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" class="custom-input" placeholder="••••••••" oninput="validateForm()">
            </div>

            <div class="form-group">
                <label for="cardNumber">Número de tarjeta</label>
                <input type="text" id="cardNumber" class="custom-input" placeholder="0000 0000 0000 0000" oninput="validateForm()">
            </div>

            <button type="button" id="submitBtn" class="btn-submit" disabled onclick="submitForm()">Registrarse</button>
        </div>

        <!-- PANTALLA DE REGISTRO EXITOSO -->
        <div id="successScreen" class="success-screen">
            <h1 class="title" style="border: none; color: #4020f0;">Registro Exitoso</h1>
            <p class="subtitle">registro hecho correctamente, vuelve a abrir tu aplicacion de Lumina.</p>
            <button class="btn-back" onclick="resetForm()">VOLVER</button>
        </div>

    </div>

    <script>
        const usernameInput = document.getElementById('username');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const cardNumberInput = document.getElementById('cardNumber');
        const submitBtn = document.getElementById('submitBtn');

        const registerScreen = document.getElementById('registerScreen');
        const successScreen = document.getElementById('successScreen');

        // Función para validar que las 4 casillas tengan texto (sin espacios vacíos)
        function validateForm() {
            const hasUsername = usernameInput.value.trim() !== '';
            const hasEmail = emailInput.value.trim() !== '';
            const hasPassword = passwordInput.value.trim() !== '';
            const hasCard = cardNumberInput.value.trim() !== '';

            if (hasUsername && hasEmail && hasPassword && hasCard) {
                submitBtn.disabled = false;
            } else {
                submitBtn.disabled = true;
            }
        }

        // Función que se ejecuta al presionar "REGISTRARSE"
        function submitForm() {
            registerScreen.style.display = 'none';
            successScreen.style.display = 'flex';
        }

        // Función para volver al inicio y reiniciar los campos
        function resetForm() {
            usernameInput.value = '';
            emailInput.value = '';
            passwordInput.value = '';
            cardNumberInput.value = '';
            submitBtn.disabled = true;

            successScreen.style.display = 'none';
            registerScreen.style.display = 'flex';
        }
    </script>
</body>
</html>
